version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: pps_postgres
    restart: always
    environment:
      POSTGRES_USER: pps_user
      POSTGRES_PASSWORD: pps_password
      POSTGRES_DB: pps_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pps_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pps.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"

volumes:
  postgres_data:
